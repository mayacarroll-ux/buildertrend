<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Advisory Panels</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    font-size: 14px;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #1e2433;
    border-bottom: 1px solid #2d3748;
    color: white;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  header h1 { font-size: 17px; font-weight: 600; white-space: nowrap; }

  /* CONTROLS */
  .controls {
    background: #1a1f2e;
    border-bottom: 1px solid #2d3748;
    padding: 10px 16px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 180px;
  }

  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: #4b5563;
  }

  input[type="search"] {
    width: 100%;
    padding: 8px 12px 8px 34px;
    border: 1px solid #2d3748;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    background: #0f1117;
    color: #e2e8f0;
  }

  input[type="search"]:focus {
    border-color: #4f7ef7;
    box-shadow: 0 0 0 3px rgba(79,126,247,0.15);
  }

  input[type="search"]::placeholder { color: #4b5563; }

  select {
    padding: 7px 10px;
    border: 1px solid #2d3748;
    border-radius: 8px;
    font-size: 13px;
    background: #0f1117;
    color: #e2e8f0;
    cursor: pointer;
    outline: none;
  }

  select:focus { border-color: #4f7ef7; }

  .multi-select { position: relative; }

  .multi-select-btn {
    padding: 7px 10px;
    border: 1px solid #2d3748;
    border-radius: 8px;
    font-size: 13px;
    background: #0f1117;
    color: #e2e8f0;
    cursor: pointer;
    outline: none;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
    user-select: none;
  }

  .multi-select-btn:focus, .multi-select-btn.open { border-color: #4f7ef7; }

  .multi-select-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    background: #1a1f2e;
    border: 1px solid #2d3748;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    z-index: 999;
    min-width: 170px;
    padding: 6px 0;
  }

  .multi-select-dropdown.open { display: block; }

  .multi-select-dropdown label {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    cursor: pointer;
    font-size: 13px;
    color: #e2e8f0;
    transition: background 0.1s;
  }

  .multi-select-dropdown label:hover { background: #1e2a3a; }

  .multi-select-dropdown input[type="checkbox"] {
    accent-color: #4f7ef7;
    width: 14px;
    height: 14px;
    cursor: pointer;
  }

  .count {
    margin-left: auto;
    color: #4b5563;
    font-size: 12px;
    white-space: nowrap;
  }

  /* SPLIT LAYOUT */
  .split-view {
    display: flex;
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  /* SIDE PANEL */
  #table-view {
    width: 280px;
    flex-shrink: 0;
    overflow-y: auto;
    border-right: 1px solid #2d3748;
    background: #0f1117;
  }

  /* Member cards */
  .member-list { padding: 8px; }

  .member-card {
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 4px;
    cursor: default;
    transition: background 0.12s;
    border: 1px solid transparent;
  }

  .member-card:hover {
    background: #1a1f2e;
    border-color: #2d3748;
  }

  .member-name {
    font-weight: 600;
    font-size: 13px;
    color: #f1f5f9;
    line-height: 1.3;
  }

  .member-company {
    font-size: 12px;
    color: #64748b;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .member-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    flex-wrap: wrap;
  }

  .member-location {
    font-size: 11px;
    color: #475569;
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 7px;
    border-radius: 99px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .badge-live   { background: #052e16; color: #4ade80; border: 1px solid #14532d; }
  .badge-async  { background: #0c1a2e; color: #60a5fa; border: 1px solid #1e3a5f; }
  .badge-lead   { background: #1a1f2e; color: #64748b; border: 1px solid #2d3748; }
  .badge-unsub  { background: #1c0a0a; color: #f87171; border: 1px solid #450a0a; }
  .badge-none   { background: #1a1f2e; color: #4b5563; border: 1px solid #2d3748; }

  .highlight { background: #713f12; color: #fde68a; border-radius: 2px; }
  .empty { text-align: center; padding: 40px 16px; color: #374151; font-size: 13px; }

  /* Mobile view toggle */
  .mobile-tabs {
    display: none;
    gap: 4px;
  }

  .mobile-tab-btn {
    flex: 1;
    padding: 7px;
    border: 1px solid #2d3748;
    border-radius: 8px;
    background: transparent;
    color: #64748b;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }

  .mobile-tab-btn.active {
    background: #4f7ef7;
    border-color: #4f7ef7;
    color: white;
  }

  /* Responsive */
  @media (max-width: 700px) {
    header { padding: 10px 14px; }
    header h1 { font-size: 15px; }
    #beta-count { display: none; }

    .controls { padding: 8px 12px; gap: 6px; }
    .search-wrap { min-width: 100%; order: -1; }
    .count { font-size: 11px; }
    .mobile-tabs { display: flex; width: 100%; }

    .split-view { position: relative; }

    #table-view {
      width: 100%;
      position: absolute;
      inset: 0;
      z-index: 2;
      border-right: none;
    }

    #map-view {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    #table-view.mobile-hidden { display: none; }
    #map-view.mobile-hidden { display: none !important; }
  }

  /* MAP VIEW */
  #map-view {
    flex: 1;
    display: flex;
    position: relative;
    min-height: 0;
  }

  #map {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
  }

  /* Dark tile filter */
  .leaflet-tile { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7); }

  .leaflet-container { background: #0f1117; }

  /* Custom popup */
  .leaflet-popup-content-wrapper {
    background: #1e2433;
    color: #e2e8f0;
    border: 1px solid #2d3748;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .leaflet-popup-tip { background: #1e2433; }
  .leaflet-popup-close-button { color: #64748b !important; }

  .popup-location { font-size: 12px; color: #64748b; margin-bottom: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }

  .popup-member {
    padding: 6px 0;
    border-bottom: 1px solid #2d3748;
  }

  .popup-member:last-child { border-bottom: none; }

  .popup-name { font-weight: 600; color: #f1f5f9; font-size: 13px; }
  .popup-company { color: #94a3b8; font-size: 12px; }
  .popup-email { color: #4f7ef7; font-size: 12px; text-decoration: none; display: block; margin-top: 2px; }

  /* Map no-location notice */
  .map-notice {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: #1e2433;
    border: 1px solid #2d3748;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 12px;
    color: #64748b;
    z-index: 1000;
    white-space: nowrap;
  }
</style>
</head>

<div id="auth-gate" style="
  position:fixed;inset:0;z-index:9999;
  background:#0f1117;
  display:flex;align-items:center;justify-content:center;
">
  <div style="

      style="
        width:100%;padding:10px 14px;border-radius:6px;
        border:1px solid #2d3748;background:#0f1117;
        color:#e2e8f0;font-size:14px;outline:none;margin-bottom:12px;
      "
    >
    <div id="pw-error" style="color:#f87171;font-size:12px;margin-bottom:10px;display:none">Incorrect password</div>
    <button onclick="checkPassword()" style="
      width:100%;padding:10px;border-radius:6px;border:none;
      background:#4f7ef7;color:white;font-size:14px;font-weight:600;cursor:pointer;
    ">Enter</button>
  </div>
</div>

<script>
  const PASS_HASH = "008c70392e3abfbd0fa47bbc2ed96aa99bd49e159727fcba0f2e6abeb3a9d601";
  async function hashStr(s) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  }
  async function checkPassword() {
    const val = document.getElementById("pw-input").value;
    const h = await hashStr(val);
    if (h === PASS_HASH) {
      sessionStorage.setItem("cab_auth", h);
      document.getElementById("auth-gate").style.display = "none";
    } else {
      document.getElementById("pw-error").style.display = "block";
    }
  }
  document.getElementById("pw-input").addEventListener("keydown", e => { if (e.key === "Enter") checkPassword(); });
  (async () => {
    const stored = sessionStorage.getItem("cab_auth");
    if (stored && stored === PASS_HASH) document.getElementById("auth-gate").style.display = "none";
  })();
</script>

// Fix VIC (Victoria, Australia)
GEOCODED["VIC"] = { lat: -37.4713, lon: 144.7852 };

let allRecords = [];
let sortCol = "Name";
let sortDir = 1;
let map = null;
let markers = [];

async function fetchAll() {
  let records = [];
  let offset = null;
  do {
    let url = `https://api.airtable.com/v0/${BASE}/${TABLE}?pageSize=100`;
    if (offset) url += `&offset=${offset}`;
    const res = await fetch(url, { headers: { Authorization: `Bearer ${TOKEN}` } });
    const data = await res.json();
    records.push(...data.records);
    offset = data.offset;
  } while (offset);
  return records;
}

function badgeClass(eng) {
  if (eng === "Live Member") return "badge-live";
  if (eng === "Async Member") return "badge-async";
  if (eng === "Lead") return "badge-lead";
  if (eng === "Unsubscribe") return "badge-unsub";
  return "badge-none";
}

function esc(s) {
  return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function highlight(text, query) {
  if (!query) return esc(text);
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return esc(text).replace(new RegExp(`(${escaped})`, 'gi'), '<mark class="highlight">$1</mark>');
}

function getValue(fields, col) {
  if (col === "location") return [fields.City, fields.State].filter(Boolean).join(", ");
  if (col === "Tags") return (fields.Tags || []).join(", ");
  return fields[col] || "";
}

function populateStateFilter() {
  const countryFilter = document.getElementById("countryFilter").value;
  const stateSelect = document.getElementById("stateFilter");
  const current = stateSelect.value;

  const states = new Map();
  allRecords.forEach(r => {
    const state = (r.fields.State || "").trim();
    if (!state) return;
    const country = inferCountry(state);
    if (countryFilter && country !== countryFilter) return;
    if (!states.has(state)) states.set(state, 0);
    states.set(state, states.get(state) + 1);
  });

  const sorted = [...states.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  stateSelect.innerHTML = `<option value="">All States/Provinces</option>` +
    sorted.map(([s, n]) => `<option value="${s}"${s === current ? " selected" : ""}>${s} (${n})</option>`).join("");
}

function getFiltered() {
  const query = document.getElementById("search").value.trim().toLowerCase();
  const engFilter = getEngagementSelected();
  const tagFilter = document.getElementById("tagFilter").value;
  const countryFilter = document.getElementById("countryFilter").value;
  const stateFilter = document.getElementById("stateFilter").value;

  return allRecords.filter(r => {
    const f = r.fields;
    if (engFilter.length && !engFilter.includes(f.Engagement)) return false;
    if (tagFilter && !(f.Tags || []).includes(tagFilter)) return false;
    if (countryFilter && inferCountry((f.State || "").trim()) !== countryFilter) return false;
    if (stateFilter && (f.State || "").trim() !== stateFilter) return false;
    if (query) {
      const searchable = [f.Name, f["Company Name"], f.Email, f.Notes, f.City, f.State]
        .filter(Boolean).join(" ").toLowerCase();
      if (!searchable.includes(query)) return false;
    }
    return true;
  });
}

function render() {
  const query = document.getElementById("search").value.trim().toLowerCase();
  let filtered = getFiltered();

  filtered.sort((a, b) => {
    const va = getValue(a.fields, sortCol).toLowerCase();
    const vb = getValue(b.fields, sortCol).toLowerCase();
    return va < vb ? -sortDir : va > vb ? sortDir : 0;
  });

  document.getElementById("count").textContent = `${filtered.length} of ${allRecords.length} results`;

  // Render cards
  const list = document.getElementById("member-list");
  const empty = document.getElementById("empty");

  if (filtered.length === 0) {
    list.innerHTML = "";
    empty.style.display = "block";
  } else {
    empty.style.display = "none";
    list.innerHTML = filtered.map(r => {
      const f = r.fields;
      const eng = f.Engagement || "";
      const loc = [f.City, f.State].filter(Boolean).join(", ");
      return `<div class="member-card">
        <div class="member-name">${highlight(f.Name || "", query)}</div>
        <div class="member-company">${highlight(f["Company Name"] || "", query)}</div>
        <div class="member-meta">
          <span class="badge ${badgeClass(eng)}">${esc(eng) || "—"}</span>
          ${loc ? `<span class="member-location">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
            ${highlight(loc, query)}
          </span>` : ""}
        </div>
      </div>`;
    }).join("");
  }

  // Render map
  if (map) renderMap(filtered);
}

function renderMap(filtered) {
  // Clear old markers
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  // Group by location key
  const byLoc = {};
  let withLocation = 0;

  filtered.forEach(r => {
    const f = r.fields;
    const city = (f.City || "").trim();
    const state = (f.State || "").trim();
    if (!city && !state) return;
    const key = city && state ? `${city}, ${state}` : city || state;
    if (!GEOCODED[key]) return;
    withLocation++;
    if (!byLoc[key]) byLoc[key] = [];
    byLoc[key].push(r);
  });

  Object.entries(byLoc).forEach(([loc, records]) => {
    const { lat, lon } = GEOCODED[loc];
    const count = records.length;

    const color = count >= 3 ? "#4ade80" : count === 2 ? "#60a5fa" : "#4f7ef7";

    const icon = L.divIcon({
      className: "",
      html: `<div style="
        width:${count > 1 ? 32 : 24}px;
        height:${count > 1 ? 32 : 24}px;
        background:${color};
        border-radius:50%;
        border:2px solid rgba(255,255,255,0.2);
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:${count > 1 ? 12 : 0}px;
        font-weight:700;
        color:#0f1117;
        box-shadow:0 2px 8px rgba(0,0,0,0.5);
      ">${count > 1 ? count : ""}</div>`,
      iconSize: [count > 1 ? 32 : 24, count > 1 ? 32 : 24],
      iconAnchor: [count > 1 ? 16 : 12, count > 1 ? 16 : 12],
    });

    const popupHtml = `
      <div style="min-width:200px;max-width:280px">
        <div class="popup-location">${esc(loc)}</div>
        ${records.map(r => {
          const f = r.fields;
          return `<div class="popup-member">
            <div class="popup-name">${esc(f.Name || "")}</div>
            <div class="popup-company">${esc(f["Company Name"] || "")}</div>
            ${f.Email ? `<a class="popup-email" href="mailto:${esc(f.Email)}">${esc(f.Email)}</a>` : ""}
            <div style="margin-top:4px"><span class="badge ${badgeClass(f.Engagement || "")}" style="font-size:10px">${esc(f.Engagement || "—")}</span></div>
          </div>`;
        }).join("")}
      </div>`;

    const marker = L.marker([lat, lon], { icon }).addTo(map);
    marker.bindPopup(popupHtml, { maxWidth: 300 });
    markers.push(marker);
  });

  const notice = document.getElementById("map-notice");
  notice.textContent = `${withLocation} of ${filtered.length} filtered members have location data`;

  const isFiltered = document.getElementById("search").value.trim() ||
    getEngagementSelected().length ||
    document.getElementById("tagFilter").value ||
    document.getElementById("countryFilter").value ||
    document.getElementById("stateFilter").value;

  if (isFiltered && markers.length > 0) {
    const group = L.featureGroup(markers);
    map.fitBounds(group.getBounds().pad(0.2));
  }
}

function initMap() {
  if (map) return;
  map = L.map("map", { zoomControl: true }).setView([39, -96], 4);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap contributors"
  }).addTo(map);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    map.invalidateSize();
    renderMap(getFiltered());
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => map.setView([pos.coords.latitude, pos.coords.longitude], 8),
        () => {} // silently fall back to US default if denied
      );
    }
  }));
}

function setMobileTab(tab) {
  const listEl = document.getElementById("table-view");
  const mapEl = document.getElementById("map-view");
  listEl.classList.toggle("mobile-hidden", tab !== "list");
  mapEl.classList.toggle("mobile-hidden", tab !== "map");
  document.getElementById("mob-list").classList.toggle("active", tab === "list");
  document.getElementById("mob-map").classList.toggle("active", tab === "map");
  if (tab === "map" && map) setTimeout(() => map.invalidateSize(), 50);
}

document.getElementById("search").addEventListener("input", render);
// Multi-select engagement dropdown
const engBtn = document.getElementById("engagementBtn");
const engDropdown = document.getElementById("engagementDropdown");
const engCheckboxes = engDropdown.querySelectorAll("input[type=checkbox]");

engBtn.addEventListener("click", () => {
  const open = engDropdown.classList.toggle("open");
  engBtn.classList.toggle("open", open);
});

document.addEventListener("click", e => {
  if (!document.getElementById("engagementMulti").contains(e.target)) {
    engDropdown.classList.remove("open");
    engBtn.classList.remove("open");
  }
});

function getEngagementSelected() {
  return Array.from(engCheckboxes).filter(c => c.checked).map(c => c.value);
}

function updateEngagementLabel() {
  const sel = getEngagementSelected();
  document.getElementById("engagementLabel").textContent =
    sel.length === 0 ? "All Engagement" :
    sel.length === 1 ? sel[0] :
    `${sel.length} selected`;
}

engCheckboxes.forEach(cb => {
  cb.addEventListener("change", () => { updateEngagementLabel(); render(); });
});
document.getElementById("tagFilter").addEventListener("change", render);
document.getElementById("countryFilter").addEventListener("change", () => {
  document.getElementById("stateFilter").value = "";
  populateStateFilter();
  render();
});
document.getElementById("stateFilter").addEventListener("change", render);


fetchAll().then(records => {
  allRecords = records;
  const live = records.filter(r => r.fields.Engagement === "Live Member").length;
  const async_ = records.filter(r => r.fields.Engagement === "Async Member").length;
  document.getElementById("beta-count").innerHTML =
    `<span style="color:#e2e8f0;font-weight:600">${live + async_}</span> Mobile App Beta Members` +
    `<br><span style="font-size:11px">${live} Live · ${async_} Async</span>`;
  populateStateFilter();
  initMap();
  render();
}).catch(err => {
  document.getElementById("count").textContent = "Error loading data";
  console.error(err);
});
</script>
